<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#656698" />
    <title>OpenFlights</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <meta
      name="description"
      content="A read-only, mobile-friendly viewer for your OpenFlights flight log."
    />
    <link rel="stylesheet" href="/css/ol.min.css" />
    <link rel="stylesheet" href="/css/ol-layerswitcher.min.css" />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <div id="loading-bar" class="loading-bar" hidden></div>

    <header class="app-header">
      <div class="app-header__row">
        <div class="app-header__leading">
          <h1 class="brand">
            <img
              class="brand__img"
              src="img/openflights-logo.png"
              alt="OpenFlights"
            />
          </h1>
          <a
            id="about-link"
            class="chip chip--ghost"
            href="/about"
            target="_blank"
            rel="noopener"
          >About</a>
        </div>
        <div class="app-header__actions">
          <button
            id="filter-toggle"
            class="chip filter-toggle"
            type="button"
            aria-expanded="false"
            aria-controls="filter-panel"
          >
            Filter
          </button>
          <button
            id="user-chip"
            class="chip chip--login"
            type="button"
            aria-haspopup="dialog"
          >
            Login
          </button>
        </div>
      </div>

      <div id="filter-panel" class="app-header__filters" hidden style="display: none">
        <label class="field field--inline">
          <select id="year-select" class="select" aria-label="Year">
            <option value="0">All years</option>
          </select>
        </label>
        <label class="field field--inline">
          <select id="carrier-select" class="select" aria-label="Carrier">
            <option value="0">All carriers</option>
          </select>
        </label>
        <label class="field field--inline">
          <select id="mode-select" class="select" aria-label="Mode">
            <option value="0">All modes</option>
          </select>
        </label>
        <label class="field field--inline">
          <select id="class-select" class="select" aria-label="Class">
            <option value="0">All classes</option>
          </select>
        </label>
        <button
          id="clear-filters"
          class="btn btn--ghost clear-filters"
          type="button"
        >
          Clear filters
        </button>
      </div>
    </header>

    <main class="app-main">
      <section
        id="view-overview"
        class="view view--scroll"
        aria-label="Overview"
      >
        <div class="pane-bar">
          <span class="pane-bar__title">Overview</span>
          <span class="pane-bar__actions">
            <button
              class="pane-bar__icon pane-bar__size"
              type="button"
              data-pane-size="overview"
              data-state="split"
              aria-label="Open the overview pane in split view"
            >
              <svg
                class="pane-bar__glyph"
                data-glyph="split"
                viewBox="0 0 24 24"
                width="18"
                height="18"
                aria-hidden="true"
              >
                <rect
                  x="4"
                  y="4"
                  width="16"
                  height="7"
                  rx="1.5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                />
                <rect
                  x="4"
                  y="13"
                  width="16"
                  height="7"
                  rx="1.5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                />
              </svg>
              <svg
                class="pane-bar__glyph"
                data-glyph="maximize"
                viewBox="0 0 24 24"
                width="18"
                height="18"
                aria-hidden="true"
              >
                <path
                  d="M9 4H4v5M15 4h5v5M4 15v5h5M20 15v5h-5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
              <svg
                class="pane-bar__glyph"
                data-glyph="restore"
                viewBox="0 0 24 24"
                width="18"
                height="18"
                aria-hidden="true"
              >
                <path
                  d="M4 9h5V4M20 9h-5V4M4 15h5v5M20 15h-5v5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
            <button
              class="pane-bar__icon"
              type="button"
              data-pane-hide="overview"
              aria-label="Hide the overview pane"
            >
              <svg
                viewBox="0 0 24 24"
                width="18"
                height="18"
                aria-hidden="true"
              >
                <path
                  d="M5 12h14"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                />
              </svg>
            </button>
          </span>
        </div>
        <div id="overview-body" class="view__scroll-body"></div>
      </section>

      <section
        id="view-flights"
        class="view view--scroll"
        aria-label="Flights"
      >
        <div class="pane-bar">
          <span class="pane-bar__title">Flights</span>
          <span class="pane-bar__actions">
            <button
              class="pane-bar__icon pane-bar__size"
              type="button"
              data-pane-size="flights"
              data-state="split"
              aria-label="Open the flights pane in split view"
            >
              <svg
                class="pane-bar__glyph"
                data-glyph="split"
                viewBox="0 0 24 24"
                width="18"
                height="18"
                aria-hidden="true"
              >
                <rect
                  x="4"
                  y="4"
                  width="16"
                  height="7"
                  rx="1.5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                />
                <rect
                  x="4"
                  y="13"
                  width="16"
                  height="7"
                  rx="1.5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                />
              </svg>
              <svg
                class="pane-bar__glyph"
                data-glyph="maximize"
                viewBox="0 0 24 24"
                width="18"
                height="18"
                aria-hidden="true"
              >
                <path
                  d="M9 4H4v5M15 4h5v5M4 15v5h5M20 15v5h-5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
              <svg
                class="pane-bar__glyph"
                data-glyph="restore"
                viewBox="0 0 24 24"
                width="18"
                height="18"
                aria-hidden="true"
              >
                <path
                  d="M4 9h5V4M20 9h-5V4M4 15h5v5M20 15h-5v5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
            <button
              class="pane-bar__icon"
              type="button"
              data-pane-hide="flights"
              aria-label="Hide the flights pane"
            >
              <svg
                viewBox="0 0 24 24"
                width="18"
                height="18"
                aria-hidden="true"
              >
                <path
                  d="M5 12h14"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                />
              </svg>
            </button>
          </span>
        </div>
        <div id="flights-body" class="view__scroll-body">
          <div class="flights-toolbar">
            <input
              id="flight-search"
              class="search"
              type="search"
              placeholder="Search flights…"
              aria-label="Search flights"
            />
            <select id="flight-sort" class="select" aria-label="Sort flights">
              <option value="date-desc">Newest first</option>
              <option value="date-asc">Oldest first</option>
              <option value="distance-desc">Longest first</option>
              <option value="distance-asc">Shortest first</option>
            </select>
          </div>
          <div id="airport-filter" class="airport-filter" hidden>
            <span id="airport-filter-text" class="airport-filter__text"></span>
            <button
              id="airport-filter-clear"
              class="airport-filter__clear"
              type="button"
              aria-label="Clear airport filter"
            >
              ✕
            </button>
          </div>
          <p id="flight-count" class="flight-count" aria-live="polite"></p>
          <div id="flight-list" class="flight-list"></div>
        </div>
      </section>

      <section id="view-map" class="view view--map is-active" aria-label="Map">
        <div class="pane-bar">
          <span class="pane-bar__title">Map</span>
          <span class="pane-bar__actions">
            <button
              class="pane-bar__icon pane-bar__size"
              type="button"
              data-pane-size="map"
              data-state="split"
              aria-label="Open the map pane in split view"
            >
              <svg
                class="pane-bar__glyph"
                data-glyph="split"
                viewBox="0 0 24 24"
                width="18"
                height="18"
                aria-hidden="true"
              >
                <rect
                  x="4"
                  y="4"
                  width="16"
                  height="7"
                  rx="1.5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                />
                <rect
                  x="4"
                  y="13"
                  width="16"
                  height="7"
                  rx="1.5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                />
              </svg>
              <svg
                class="pane-bar__glyph"
                data-glyph="maximize"
                viewBox="0 0 24 24"
                width="18"
                height="18"
                aria-hidden="true"
              >
                <path
                  d="M9 4H4v5M15 4h5v5M4 15v5h5M20 15v5h-5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
              <svg
                class="pane-bar__glyph"
                data-glyph="restore"
                viewBox="0 0 24 24"
                width="18"
                height="18"
                aria-hidden="true"
              >
                <path
                  d="M4 9h5V4M20 9h-5V4M4 15h5v5M20 15h-5v5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
            <button
              class="pane-bar__icon"
              type="button"
              data-pane-hide="map"
              aria-label="Hide the map pane"
            >
              <svg
                viewBox="0 0 24 24"
                width="18"
                height="18"
                aria-hidden="true"
              >
                <path
                  d="M5 12h14"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                />
              </svg>
            </button>
          </span>
        </div>
        <div id="map" class="map"></div>
      </section>
    </main>

    <button
      id="add-flight"
      class="fab"
      type="button"
      aria-label="Add flight"
      hidden
    >
      +
    </button>

    <nav class="tabbar" aria-label="Primary">
      <button
        class="tabbar__tab is-active"
        type="button"
        data-view="map"
        aria-selected="true"
      >
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path
            d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"
            fill="currentColor"
          />
        </svg>
        <span>Map</span>
      </button>

      <button
        class="tabbar__tab"
        type="button"
        data-view="overview"
        aria-selected="false"
      >
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path
            d="M4 13h6V4H4v9zm0 7h6v-5H4v5zm10 0h6V11h-6v9zm0-16v5h6V4h-6z"
            fill="currentColor"
          />
        </svg>
        <span>Overview</span>
      </button>

      <button
        class="tabbar__tab"
        type="button"
        data-view="flights"
        aria-selected="false"
      >
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path
            d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5L21 16z"
            fill="currentColor"
          />
        </svg>
        <span>Flights</span>
      </button>
    </nav>

    <div id="sheet-backdrop" class="sheet-backdrop" hidden></div>
    <div
      id="user-sheet"
      class="sheet"
      role="dialog"
      aria-modal="true"
      aria-labelledby="user-sheet-title"
      hidden
    >
      <div class="sheet__header">
        <h2 id="user-sheet-title">Login</h2>
        <button
          id="sheet-close"
          class="icon-btn"
          type="button"
          aria-label="Close"
        >
          ✕
        </button>
      </div>

      <div class="sheet__body">
        <p id="sheet-status" class="sheet__status"></p>

        <form id="login-form" class="sheet__section">
          <h3>Log in</h3>
          <label class="field">
            <span class="field__label">Username</span>
            <input
              id="login-username"
              class="input"
              type="text"
              name="username"
              autocomplete="username"
            />
          </label>
          <label class="field">
            <span class="field__label">Password</span>
            <input
              id="login-password"
              class="input"
              type="password"
              name="password"
              autocomplete="current-password"
            />
          </label>
          <button class="btn" type="submit">Log in</button>
        </form>

        <div class="sheet__section sheet__section--actions">
          <button id="logout-btn" class="btn btn--ghost" type="button">
            Log out
          </button>
        </div>
      </div>
    </div>

    <div id="chooser-backdrop" class="sheet-backdrop" hidden></div>
    <div
      id="airport-chooser"
      class="sheet"
      role="dialog"
      aria-modal="true"
      aria-labelledby="airport-chooser-title"
      hidden
    >
      <div class="sheet__header">
        <h2 id="airport-chooser-title">Choose airport</h2>
        <button
          id="chooser-close"
          class="icon-btn"
          type="button"
          aria-label="Close"
        >
          ✕
        </button>
      </div>
      <div class="sheet__body">
        <p id="chooser-subtitle" class="sheet__status"></p>
        <button
          id="chooser-zoom"
          class="btn btn--primary chooser-zoom"
          type="button"
          hidden
        >
          Zoom in
        </button>
        <div id="chooser-list" class="chooser-list"></div>
      </div>
    </div>

    <div id="editor-backdrop" class="sheet-backdrop" hidden></div>
    <div
      id="flight-editor"
      class="sheet"
      role="dialog"
      aria-modal="true"
      aria-labelledby="flight-editor-title"
      hidden
    >
      <div class="sheet__header">
        <h2 id="flight-editor-title">Add flight</h2>
        <button
          id="editor-close"
          class="icon-btn"
          type="button"
          aria-label="Close"
        >
          ✕
        </button>
      </div>

      <div class="sheet__body">
        <p id="editor-error" class="sheet__status editor-error" hidden></p>
        <div id="editor-route" class="editor-route"></div>

        <form id="flight-editor-form" class="sheet__section">
          <div class="editor-grid">
            <div class="autocomplete">
              <label class="field__label" for="editor-from">From</label>
              <input
                id="editor-from"
                class="input"
                type="text"
                autocomplete="off"
                placeholder="City, code or airport"
              />
              <div id="from-suggestions" class="autocomplete__list" hidden></div>
            </div>
            <div class="autocomplete">
              <label class="field__label" for="editor-to">To</label>
              <input
                id="editor-to"
                class="input"
                type="text"
                autocomplete="off"
                placeholder="City, code or airport"
              />
              <div id="to-suggestions" class="autocomplete__list" hidden></div>
            </div>
          </div>

          <div class="editor-grid">
            <label class="field">
              <span class="field__label">Date</span>
              <input id="editor-date" class="input" type="date" />
            </label>
            <label class="field">
              <span class="field__label">Time</span>
              <input id="editor-time" class="input" type="time" />
            </label>
          </div>

          <div class="field">
            <span class="field__label">Mode</span>
            <div
              id="editor-mode"
              class="segmented"
              role="radiogroup"
              aria-label="Mode"
            ></div>
          </div>

          <div class="editor-grid">
            <label class="field">
              <span class="field__label">Flight number</span>
              <input id="editor-number" class="input" type="text" />
            </label>
            <div class="autocomplete">
              <label class="field__label" for="editor-airline">Airline</label>
              <input
                id="editor-airline"
                class="input"
                type="text"
                autocomplete="off"
                placeholder="Airline name"
              />
              <div
                id="airline-suggestions"
                class="autocomplete__list"
                hidden
              ></div>
            </div>
          </div>

          <div class="editor-grid">
            <div class="autocomplete">
              <label class="field__label" for="editor-plane">Plane</label>
              <input
                id="editor-plane"
                class="input"
                type="text"
                autocomplete="off"
                placeholder="e.g. A320"
              />
              <div id="plane-suggestions" class="autocomplete__list" hidden></div>
            </div>
            <label class="field">
              <span class="field__label">Seat</span>
              <input id="editor-seat" class="input" type="text" />
            </label>
          </div>

          <div class="editor-grid editor-grid--3">
            <label class="field">
              <span class="field__label">Seat type</span>
              <select id="editor-seat-type" class="select">
                <option value="">—</option>
                <option value="W">Window</option>
                <option value="A">Aisle</option>
                <option value="M">Middle</option>
              </select>
            </label>
            <label class="field">
              <span class="field__label">Class</span>
              <select id="editor-class" class="select">
                <option value="">—</option>
                <option value="Y">Economy</option>
                <option value="P">Premium Economy</option>
                <option value="C">Business</option>
                <option value="F">First</option>
              </select>
            </label>
            <label class="field">
              <span class="field__label">Reason</span>
              <select id="editor-reason" class="select">
                <option value="">—</option>
                <option value="B">Work</option>
                <option value="L">Leisure</option>
                <option value="C">Crew</option>
                <option value="O">Other</option>
              </select>
            </label>
          </div>

          <div class="editor-grid">
            <label class="field">
              <span class="field__label">Distance (mi)</span>
              <input
                id="editor-distance"
                class="input"
                type="number"
                min="0"
                step="1"
                placeholder="Auto"
              />
            </label>
            <label class="field">
              <span class="field__label">Duration (HH:MM)</span>
              <input
                id="editor-duration"
                class="input"
                type="text"
                placeholder="Auto"
              />
            </label>
          </div>

          <label class="field">
            <span class="field__label">Registration</span>
            <input id="editor-registration" class="input" type="text" />
          </label>
          <label class="field">
            <span class="field__label">Note</span>
            <textarea id="editor-note" class="input editor-note" rows="2"></textarea>
          </label>

          <div class="editor-actions">
            <button
              id="editor-delete"
              class="btn btn--danger"
              type="button"
              hidden
            >
              Delete
            </button>
            <button id="editor-cancel" class="btn btn--ghost" type="button">
              Cancel
            </button>
            <button class="btn btn--primary" type="submit">Save</button>
          </div>
        </form>
      </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="/js/ol.min.js"></script>
    <script src="/js/ol-layerswitcher.min.js"></script>
    <script src="/js/greatcircle.js"></script>
    <script src="/js/md5.min.js"></script>
    <script src="/js/flights.js"></script>
    <script src="/js/map.js"></script>
    <script src="/js/mapview.js"></script>
    <script src="app.js"></script>
  </body>
</html>
